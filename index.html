<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>Dr Baseball</title>

<style>
 

body{
  background:#111;
  color:white;
  font-family:Arial;
  margin:20px;
}

h1{
  text-align:center;
}

#games{
  display:grid;
  grid-template-columns:
  repeat(auto-fill,minmax(320px,1fr));
  gap:15px;
}

.card{

  border:1px solid #444;

  border-radius:10px;

  padding:15px;

  background:#1b1b1b;

.market-title{
  color:#f5b041;
  font-weight:bold;
  margin-top:10px;
  margin-bottom:5px;
  text-transform:uppercase;
}
 .steam{
  color:#FFD700;
  font-weight:bold;
}
.line{
  display:flex;
  justify-content:space-between;
  margin:4px 0;
}

.odds{
  font-weight:bold;
}

.favorite-tag{
  color:#4CAF50;
}

.favorite{
  color:#4CAF50;
  font-weight:bold;
}

.time{
  color:#aaa;
}
.header{
  background:#181818;
  border:1px solid #333;
  border-radius:12px;
  padding:20px;
  margin-bottom:20px;
  text-align:center;
}

.logo{
  font-size:32px;
  font-weight:bold;
  color:white;
}

.subtitle{
  color:#999;
  margin-top:5px;
  font-size:14px;
}

.game-count{
  margin-top:10px;
  color:#4CAF50;
  font-weight:bold;
}

 
</style>
</head>

<body>

<header class="header">

  <div class="logo">
    ⚾ Dr Baseball
  </div>

  <div class="subtitle">
    MLB Odds & Line Movements
  </div>

  <div id="gameCount" class="game-count">
    Loading...
  </div>

</header>

<div id="games"></div>

<script>
const API_URL = "./todaycard.json";

async function loadGames(){

  try {

    const response = await fetch(API_URL);
    const games = await response.json();

    const container =
      document.getElementById("games");

    container.innerHTML = "";

   document.getElementById("gameCount").innerHTML =
  `MLB • ${games.length} Games Today`;

   const movesResponse =
  await fetch("./movements.json");

const moves =
  await movesResponse.json();

   games.forEach(game => {

  const gameMoves = moves.filter(
    move => move.gameId === game.gameId
  );

  let movementHtml = "";

  gameMoves.forEach(move => {

    if(Math.abs(move.movement) >= 5){

      movementHtml += `

        <div>

          ${move.selection}

          <br>

          ${move.old_odds}
          →
          ${move.new_odds}

        </div>

      `;

    }

  });

  container.innerHTML += `

    <div class="card">

      <h3>
        ${game.away_team}
        vs
        ${game.home_team}
      </h3>

      <div class="time">
        ${game.commence_time}
      </div>

      <hr>

      <div>
        ${game.favorite}
        <span class="favorite">
          (${game.favorite_odds})
        </span>
      </div>

      <div>
        ${game.underdog}
        (${game.underdog_odds})
      </div>

      <div class="market-title">
        Runline
      </div>

      <div>

        ${Object.keys(game.runline)[0]}
        (${Object.values(game.runline)[0]})

        <br>

        ${Object.keys(game.runline)[1]}
        (${Object.values(game.runline)[1]})

      </div>

      <div class="market-title">
        Totals
      </div>

      <div>

        ${Object.keys(game.totals)[0]}
        (${Object.values(game.totals)[0]})

        <br>

        ${Object.keys(game.totals)[1]}
        (${Object.values(game.totals)[1]})

      </div>

      ${movementHtml ? `

        <div class="market-title steam">

          🔥 Movimiento

        </div>

        ${movementHtml}

      ` : ""}

    </div>

  `;

});

  } catch(error){

    document.getElementById("games").innerHTML =
      "<h2>Error cargando partidos</h2>";

    console.error(error);

  }

}

loadGames();

setInterval(
  loadGames,
  30000
);

</script>

</body>
</html>
