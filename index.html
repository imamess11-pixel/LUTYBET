 <div

  onclick="filterSteamGames()"
  style="cursor:pointer"
>

<script>

const API_URL = "./todaycard.json";

let mlbVisible = false;
let steamOnly = false;

function showAllGames(){

  steamOnly = false;

  loadGames();

}

function showSteamGames(){

  steamOnly = true;

  loadGames();

}

function toggleSports(){

  const menu =
    document.getElementById(
      "sportsMenu"
    );

  menu.style.display =
    menu.style.display === "block"
      ? "none"
      : "block";

}

function toggleLeague(menuId){

  const menu =
    document.getElementById(
      menuId
    );

  menu.style.display =
    menu.style.display === "block"
      ? "none"
      : "block";

}
function toggleMLB(){

  const module =
    document.getElementById("mlbModule");

  const games =
    document.getElementById("games");

  mlbVisible = !mlbVisible;

  if(mlbVisible){

      module.style.display="block";

      games.style.display="flex";

  }else{

      module.style.display="none";

  }

}function scrollToGame(gameId){

  const card =
    document.getElementById(
      "game-" + gameId
    );

  if(card){

    card.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

    card.style.border =
      "2px solid gold";

    setTimeout(() => {

      card.style.border =
        "1px solid #333";

    }, 3000);

  }
  

}
let steamFilter = false;

function filterSteamGames(){

  const cards =
    document.querySelectorAll(".game-row");

  const steamCard =
    document.querySelector(
      ".stat-card:nth-child(2)"
    );

  steamFilter = !steamFilter;

  cards.forEach(card => {

    if(steamFilter){

      if(
        !card.classList.contains(
          "has-steam"
        )
      ){

        card.style.display = "none";

      }

    } else {

      card.style.display = "";

    }
    

  });

  if(steamFilter){

    steamCard.classList.add(
      "stat-card-active"
    );

  } else {

    steamCard.classList.remove(
      "stat-card-active"
    );

  }

}
async function loadGames(){

try{

const response =
  await fetch(API_URL);

const games =
  await response.json();

const movesResponse =
  await fetch("./movements.json");

const moves =
  await movesResponse.json();
const hotGames = [];

games.forEach(game => {

  const count =
    moves.filter(
      m =>
        m.gameId === game.gameId &&
        Math.abs(m.movement) >= 5
    ).length;

 hotGames.push({
  gameId: game.gameId,
  name: game.away_team + " vs " + game.home_team,
  count
});

});

hotGames.sort(
  (a,b) => b.count - a.count
);
document.getElementById("hotGames").innerHTML =

  hotGames
    .filter(g => g.count > 0)
    .slice(0,3)
    .map((g,index) => `

      <div
        class="hot-card"
        onclick="scrollToGame('${g.gameId}')"
        style="cursor:pointer"
      >

        <div class="hot-rank">

          #${index + 1}

        </div>

        <div class="hot-game">

          🔥 ${g.name}

        </div>

        <div class="hot-count">

          ${g.count} Steam Moves

        </div>

      </div>

    `)
    .join("");
document.getElementById("gameCount").innerHTML =
  `MLB • ${games.length} Games Today`;
const now = new Date();

document.getElementById(
  "lastUpdate"
).innerHTML =

  "Updated: " +

  now.toLocaleTimeString(
    [],
    {
      hour:'2-digit',
      minute:'2-digit'
    }
  );

document.getElementById("gamesToday").innerHTML =
  games.length;

let steamCount = 0;

const container =
  document.getElementById("games");

container.innerHTML = "";

// ORDENAR POR FECHA REAL (para que el agrupado por dia salga bien)
games.sort((a, b) => {
  const da = new Date(a.commence_time);
  const db = new Date(b.commence_time);
  if (isNaN(da) || isNaN(db)) return 0;
  return da - db;
});

function startOfDay(d){
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function dateGroupLabel(date){
  const diffDays = Math.round(
    (startOfDay(date) - startOfDay(new Date())) / 86400000
  );
  if(diffDays === 0) return "Hoy";
  if(diffDays === 1) return "Mañana";
  return date.toLocaleDateString('es-ES', {
    weekday:'long',
    day:'numeric',
    month:'long'
  });
}

let lastGroupKey = null;

games.forEach(game => {

const gameMoves =
  moves.filter(
    m => m.gameId === game.gameId
  );
const steamMovesCount =
  gameMoves.filter(
    move =>
      Math.abs(move.movement) >= 5
  ).length;

if(
  steamOnly &&
  steamMovesCount === 0
){
  return;
}
let movementHtml = "";

gameMoves.forEach(move => {

if(Math.abs(move.movement) >= 5){

steamCount++;

movementHtml += `
<div class="steam">

🔥 ${move.selection}

<br>

${move.old_odds}
→
${move.new_odds}

</div>
`;

}

});

// BARRA DE FECHA (Hoy / Mañana / dia 3) - solo cuando cambia el dia,
// con encabezados de columna como en una casa de apuestas
const gameDate = new Date(game.commence_time);

if(!isNaN(gameDate)){

  const groupKey =
    startOfDay(gameDate).toISOString();

  if(groupKey !== lastGroupKey){

    lastGroupKey = groupKey;

    container.innerHTML += `
      <div class="date-bar">
        <span class="date-label">${dateGroupLabel(gameDate)}</span>
        <span class="col-header">Run Line</span>
        <span class="col-header">Total</span>
        <span class="col-header">Money Line</span>
      </div>
    `;

  }

}

// Lineas alternas extra (mas alla del primer par) para runline/totals,
// se muestran solo al expandir la fila.
function lineasExtra(oddsObj, gameId, market){

  const entries = Object.entries(oddsObj || {});

  if(entries.length <= 2) return "";

  return entries.slice(2).map(([label, odds]) =>
    renderPick(gameId, market, label, label, odds)
  ).join("");

}

// Extrae solo el punto (ej "-1.5") de una key tipo "Team Name -1.5",
// para no repetir el nombre del equipo que ya aparece a la izquierda.
function extraerPunto(label, teamName){
  if(!label) return "";
  return label.replace(teamName, "").trim() || label;
}

// Ordena un objeto de odds (runline) para que la primera entrada sea
// la del equipo visitante y la segunda la del local, alineado con
// el orden en que se muestran los equipos a la izquierda.
function ordenarPorEquipo(oddsObj, awayTeam, homeTeam){
  const entries = Object.entries(oddsObj || {});
  const away = entries.find(([label]) => label.startsWith(awayTeam));
  const home = entries.find(([label]) => label.startsWith(homeTeam));
  return { away, home };
}

// Boton clickeable para una seleccion completa (punto + cuota juntos
// como una sola unidad). Guarda los datos en data-* attributes;
// togglePick() resalta el boton entero y lo guarda en la boleta.
function renderPick(gameId, market, selectionKey, pointLabel, odds){

  if(odds === "" || odds === undefined || odds === null){
    return `
      <div class="odds-pick odds-pick-empty">
        <span class="pick-point">${pointLabel || ""}</span>
        <span class="pick-price">-</span>
      </div>
    `;
  }

  return `
    <button
      class="odds-pick"
      data-game="${gameId}"
      data-market="${market}"
      data-selection="${String(selectionKey).replace(/"/g,'&quot;')}"
      data-odds="${odds}"
      onclick="event.stopPropagation(); togglePick(this)"
    >
      <span class="pick-point">${pointLabel || ""}</span>
      <span class="pick-price">${odds}</span>
    </button>
  `;
}

const { away: awayRL, home: homeRL } =
  ordenarPorEquipo(game.runline, game.away_team, game.home_team);

const { away: awayTot, home: homeTot } = (() => {
  const entries = Object.entries(game.totals || {});
  // Totals no es por equipo (Over/Under), se deja en el orden que venga
  return { away: entries[0], home: entries[1] };
})();

const awayIsFavorite = game.favorite === game.away_team;
const awayML = awayIsFavorite ? game.favorite_odds : game.underdog_odds;
const homeML = awayIsFavorite ? game.underdog_odds : game.favorite_odds;

container.innerHTML += `

<div class="game-row" id="game-${game.gameId}" onclick="toggleCard('card-${game.gameId}')">

  <div class="game-time">
    ${game.commence_time.split(" ").slice(1).join(" ")}
  </div>

  <div class="game-teams">
    <div class="game-team-line">${game.away_team}</div>
    <div class="game-team-line">${game.home_team}</div>
  </div>

  <div class="odds-col">
    ${renderPick(game.gameId, "Runline", awayRL ? awayRL[0] : "", awayRL ? extraerPunto(awayRL[0], game.away_team) : "", awayRL ? awayRL[1] : "")}
    ${renderPick(game.gameId, "Runline", homeRL ? homeRL[0] : "", homeRL ? extraerPunto(homeRL[0], game.home_team) : "", homeRL ? homeRL[1] : "")}
  </div>

  <div class="odds-col">
    ${renderPick(game.gameId, "Totals", awayTot ? awayTot[0] : "", awayTot ? awayTot[0] : "", awayTot ? awayTot[1] : "")}
    ${renderPick(game.gameId, "Totals", homeTot ? homeTot[0] : "", homeTot ? homeTot[0] : "", homeTot ? homeTot[1] : "")}
  </div>

  <div class="odds-col">
    ${renderPick(game.gameId, "Moneyline", game.away_team, game.away_team, awayML)}
    ${renderPick(game.gameId, "Moneyline", game.home_team, game.home_team, homeML)}
  </div>

</div>

<div class="expand-panel" id="card-${game.gameId}">

  ${lineasExtra(game.runline, game.gameId, "Runline") ? `<div class="market-title">Runline (lineas alternas)</div>${lineasExtra(game.runline, game.gameId, "Runline")}` : ""}

  ${lineasExtra(game.totals, game.gameId, "Totals") ? `<div class="market-title">Totals (lineas alternas)</div>${lineasExtra(game.totals, game.gameId, "Totals")}` : ""}

  ${movementHtml ? `<div class="market-title steam">🔥 Movimiento</div>${movementHtml}` : ""}

  ${!lineasExtra(game.runline, game.gameId, "Runline") && !lineasExtra(game.totals, game.gameId, "Totals") && !movementHtml ? `<div class="time">Sin datos adicionales por ahora.</div>` : ""}

</div>

`;
});

document.getElementById("steamCount").innerHTML =
  steamCount;

}catch(error){

document.getElementById("games").innerHTML =
  "<div class='loading'>Error cargando partidos</div>";

console.error(error);

}

}
// Boleta de apuestas en memoria - por ahora solo guarda las
// selecciones. El panel visual para mostrarla (con stake, total,
// etc.) se puede construir despues sobre este mismo array.
let selectedBets = [];

function togglePick(btn){

  const isSelected = btn.classList.toggle("selected");

  const pick = {
    gameId: btn.dataset.game,
    market: btn.dataset.market,
    selection: btn.dataset.selection,
    odds: btn.dataset.odds
  };

  if(isSelected){

    selectedBets.push(pick);

  } else {

    selectedBets = selectedBets.filter(b =>
      !(
        b.gameId === pick.gameId &&
        b.market === pick.market &&
        b.selection === pick.selection
      )
    );

  }

  console.log("Selecciones actuales:", selectedBets);

}

function toggleCard(id){

  const card =
    document.getElementById(id);

  if(card.style.display === "block"){

    card.style.display = "none";

  } else {

    card.style.display = "block";

  }

}
loadGames();

setInterval(
  loadGames,
  30000
);

</script>
