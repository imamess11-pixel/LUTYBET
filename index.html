<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>Dr Baseball</title>

<style>

body{
  background:#111;
  color:white;
  font-family:Arial;
  margin:20px;
}

h1{
  text-align:center;
}

#games{
  display:grid;
  grid-template-columns:
  repeat(auto-fill,minmax(320px,1fr));
  gap:15px;
}

.card{

  border:1px solid #444;

  border-radius:10px;

  padding:15px;

  background:#1b1b1b;

}

.favorite{
  color:#4CAF50;
  font-weight:bold;
}

.time{
  color:#aaa;
}

</style>
</head>

<body>

<h1>⚾ Dr Baseball</h1>

<div id="games"></div>

<script>
const API_URL = "./todaycard.json";

async function loadGames(){

  try {

    const response = await fetch(API_URL);
    const games = await response.json();

    const container =
      document.getElementById("games");

    container.innerHTML = "";

    games.forEach(game => {

      container.innerHTML += `

        <div class="card">

          <h3>
            ${game.away_team}
            vs
            ${game.home_team}
          </h3>

          <div class="time">
            ${game.commence_time}
          </div>

          <hr>

          <div>
            ${game.favorite}
            <span class="favorite">
              (${game.favorite_odds})
            </span>
          </div>

          <div>
            ${game.underdog}
            (${game.underdog_odds})
          </div>

          <hr>

          <div>
            Total:
            ${Object.keys(game.totals)[0]}
          </div>

        </div>

      `;

    });

  } catch(error){

    document.getElementById("games").innerHTML =
      "<h2>Error cargando partidos</h2>";

    console.error(error);

  }

}

loadGames();

setInterval(
  loadGames,
  30000
);

</script>

</body>
</html>
