<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dr Baseball</title>

<style>
.sub-menu{

  display:none;

  margin-left:20px;

}
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0f1114;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

/* HEADER */

.header{
  background:#14181f;
  border-bottom:2px solid #f5b041;
  padding:20px;
  position:sticky;
  top:0;
  z-index:999;
}

.logo{
  font-size:32px;
  font-weight:bold;
}

.subtitle{
  color:#9aa0a6;
  margin-top:5px;
}

.game-count{
  margin-top:10px;
  color:#4CAF50;
  font-weight:bold;
}
.last-update{

  color:#999;

  font-size:13px;

  margin-top:4px;

}
.stat-card-active{

  background:#3a2900 !important;

  border:1px solid #FFD700 !important;

  box-shadow:
    0 0 15px rgba(255,215,0,.4);

}

.stat-card-active .stat-title{

  color:#FFD700;

}

.stat-card-active .stat-value{

  color:#FFD700;

}

/* MENU */

.sports-menu{
  padding:15px;
}

.sport-btn{
  width:100%;
  background:#1d232d;
  color:white;
  border:none;
  padding:15px;
  border-radius:10px;
  cursor:pointer;
  font-size:16px;
  font-weight:bold;
}

.sport-btn:hover{
  background:#2a3342;
}

.league-menu{
  display:none;
  margin-top:5px;
}

.league-item{
  background:#171b22;
  padding:14px;
  border-radius:10px;
  cursor:pointer;
  margin-top:5px;
}

.league-item:hover{
  background:#232a36;
}

/* STATS */

.stats-bar{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
  padding:0 15px 15px;
}

.stat-card{
  background:#171b22;
  padding:15px;
  border-radius:12px;
  text-align:center;
  border:1px solid #252d3a;
}

.stat-title{
  color:#9aa0a6;
  font-size:12px;
}

.stat-value{
  font-size:22px;
  font-weight:bold;
  margin-top:6px;
}

/* GAMES */

#games{
  display:none;
  grid-template-columns:
  repeat(auto-fill,minmax(340px,1fr));
  gap:15px;
  padding:15px;
   margin-top:10px;
}

.card{
  background:#171b22;
  border:1px solid #252d3a;
  border-radius:14px;
  padding:15px;
  transition:.2s;
}

.card:hover{
  transform:translateY(-4px);
  box-shadow:0 8px 18px rgba(0,0,0,.45);
}

.card h3{
  margin-bottom:8px;
}

.time{
  color:#999;
  margin-bottom:10px;
}

.market-title{
  color:#f5b041;
  font-weight:bold;
  margin-top:12px;
  margin-bottom:6px;
  text-transform:uppercase;
}

.favorite{
  color:#4CAF50;
  font-weight:bold;
}

.underdog{
  color:#ff6b6b;
  font-weight:bold;
}

.steam{
  margin-top:12px;
  background:#332300;
  border-left:4px solid gold;
  padding:10px;
  border-radius:8px;
  animation:pulse 2s infinite;
}

@keyframes pulse{

  0%{
    box-shadow:0 0 0 0 rgba(255,215,0,.4);
  }

  70%{
    box-shadow:0 0 0 12px rgba(255,215,0,0);
  }

  100%{
    box-shadow:0 0 0 0 rgba(255,215,0,0);
  }

}

.move-up{
  color:#4CAF50;
  font-weight:bold;
}

.move-down{
  color:#ff6b6b;
  font-weight:bold;
}

.loading{
  text-align:center;
  padding:30px;
  color:#999;
}
.stats-bar{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(250px,1fr));
  gap:10px;
  margin-bottom:20px;
}

.hot-card{
  background:#2b1d00;
  border:1px solid gold;
  border-radius:10px;
  padding:12px;
  text-align:center;
  font-weight:bold;
  color:#FFD700;
}
.filter-btn{

  background:#1e1e1e;

  color:white;

  border:1px solid #333;

  padding:10px 18px;

  border-radius:8px;

  cursor:pointer;

  margin-right:8px;

  font-weight:bold;

}

.filter-btn:hover{

  background:#f5b041;

  color:black;

}
.card-header{

  cursor:pointer;

}

.card-content{

  display:none;

  margin-top:12px;

}

.expand-btn{

  color:#f5b041;

  font-weight:bold;

  margin-top:10px;

}
.odds-market{

  display:flex;

  gap:8px;

  margin-top:8px;

}

.odds-btn{
.market-buttons{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:8px;

  margin-top:8px;

}

.market-btn{

  background:#222;

  border:1px solid #444;

  border-radius:10px;

  padding:10px;

  text-align:center;

  transition:.2s;

}

.market-btn:hover{

  background:#2f2f2f;

  border-color:#f5b041;

  transform:translateY(-2px);

}

.market-label{

  display:block;

  color:#ccc;

  font-size:12px;

}

.market-odds{

  display:block;

  font-size:18px;

  font-weight:bold;

  margin-top:4px;

  color:white;

}

  flex:1;

  background:#222;

  border:1px solid #444;

  border-radius:10px;

  padding:10px;

  text-align:center;

  transition:.2s;

}

.odds-btn:hover{

  background:#2f2f2f;

  border-color:#f5b041;

  transform:translateY(-2px);

}

.team-name{

  display:block;

  font-size:13px;

  color:#ccc;

}

.team-odds{

  display:block;

  font-size:18px;

  font-weight:bold;

  color:white;

  margin-top:4px;

}
.filter-btn{

  background:#1e1e1e;

  color:white;

  border:1px solid #444;

  padding:10px 18px;

  border-radius:8px;

  cursor:pointer;

  margin-right:8px;

  font-weight:bold;

  transition:.2s;

}

.filter-btn:hover{

  background:#f5b041;

  color:black;

}
.hot-card{

  background:#2b1d00;

  border:1px solid gold;

  border-radius:12px;

  padding:15px;

  text-align:center;

}

.hot-rank{

  font-size:22px;

  font-weight:bold;

  color:#FFD700;

}

.hot-game{

  margin-top:5px;

  font-weight:bold;

  color:white;

}

.hot-count{

  margin-top:6px;

  color:#FFD700;

}


</style>

</head>

<body>

<header class="header">

  <div class="logo">
    ⚾ Dr Baseball
  </div>

  <div class="subtitle">
    MLB Odds & Steam Moves
  </div>

  <div id="gameCount" class="game-count">
    Loading...
  </div>
<div id="lastUpdate" class="last-update">
  Updated: --
</div>
</header>

<div class="sports-menu">
<div class="sports-selector">

  <button
    class="sport-btn"
    onclick="toggleSports()"
  >
    All Sports ▼
  </button>

  <div
    id="sportsMenu"
    class="league-menu"
  >

    <div
      class="league-item"
      onclick="toggleLeague('baseballMenu')"
    >
      Baseball ▶
    </div>

    <div
      id="baseballMenu"
      class="sub-menu"
    >

      <div
        class="league-item"
        onclick="toggleMLB()"
      >
        MLB
      </div>

    </div>

    <div class="league-item">
      Basketball
    </div>

    <div class="league-item">
      Football
    </div>

    <div class="league-item">
      Hockey
    </div>

    <div class="league-item">
      Soccer
    </div>

  </div>

</div>

  <button class="sport-btn" onclick="toggleLeague()">
    ⚾ Baseball ▼
  </button>

  <div id="leagueMenu" class="league-menu">

<div
  class="league-item"
  onclick="toggleMLB()">
  MLB
</div>

  </div>

</div>

<div class="stats-bar">

  <div class="stat-card">
    <div class="stat-title">Games</div>
    <div id="gamesToday" class="stat-value">0</div>
  </div>

 <div
  class="stat-card"
  onclick="filterSteamGames()"
  style="cursor:pointer"
>
    <div class="stat-title">Steam Moves</div>
    <div id="steamCount" class="stat-value">0</div>
</div>

  <div class="stat-card">
    <div class="stat-title">League</div>
    <div class="stat-value">MLB</div>
  </div>

  <div class="stat-card">
    <div class="stat-title">Refresh</div>
    <div class="stat-value">30s</div>
  </div>

</div>

<div style="padding:15px">

  <button
  class="filter-btn"
  onclick="showAllGames()">
  All
</button>

<button
  class="filter-btn"
  onclick="showSteamGames()">
  Steam Moves
</button>

</div>

<div id="hotGames" class="stats-bar"></div>

<div id="games"></div>
<script>

const API_URL = "./todaycard.json";

let mlbVisible = false;
let steamOnly = false;

function showAllGames(){

  steamOnly = false;

  loadGames();

}

function showSteamGames(){

  steamOnly = true;

  loadGames();

}

function toggleLeague(){

  const menu =
    document.getElementById("leagueMenu");

  menu.style.display =
    menu.style.display === "block"
    ? "none"
    : "block";

}

function toggleMLB(){

  const games =
    document.getElementById("games");

  mlbVisible = !mlbVisible;

  games.style.display =
    mlbVisible
    ? "grid"
    : "none";

}
function toggleSports(){

  const menu =
    document.getElementById(
      "sportsMenu"
    );

  menu.style.display =
    menu.style.display === "block"
      ? "none"
      : "block";

}

function toggleLeague(menuId){

  const menu =
    document.getElementById(
      menuId
    );

  menu.style.display =
    menu.style.display === "block"
      ? "none"
      : "block";

}
function scrollToGame(gameId){

  const card =
    document.getElementById(
      "game-" + gameId
    );

  if(card){

    card.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

    card.style.border =
      "2px solid gold";

    setTimeout(() => {

      card.style.border =
        "1px solid #333";

    }, 3000);

  }

}
let steamFilter = false;

function filterSteamGames(){

  const cards =
    document.querySelectorAll(".card");

  const steamCard =
    document.querySelector(
      ".stat-card:nth-child(2)"
    );

  steamFilter = !steamFilter;

  cards.forEach(card => {

    if(steamFilter){

      if(
        !card.classList.contains(
          "has-steam"
        )
      ){

        card.style.display = "none";

      }

    } else {

      card.style.display = "";

    }

  });

  if(steamFilter){

    steamCard.classList.add(
      "stat-card-active"
    );

  } else {

    steamCard.classList.remove(
      "stat-card-active"
    );

  }

}
async function loadGames(){

try{

const response =
  await fetch(API_URL);

const games =
  await response.json();

const movesResponse =
  await fetch("./movements.json");

const moves =
  await movesResponse.json();
const hotGames = [];

games.forEach(game => {

  const count =
    moves.filter(
      m =>
        m.gameId === game.gameId &&
        Math.abs(m.movement) >= 5
    ).length;

 hotGames.push({
  gameId: game.gameId,
  name: game.away_team + " vs " + game.home_team,
  count
});

});

hotGames.sort(
  (a,b) => b.count - a.count
);
document.getElementById("hotGames").innerHTML =

  hotGames
    .filter(g => g.count > 0)
    .slice(0,3)
    .map((g,index) => `

      <div
        class="hot-card"
        onclick="scrollToGame('${g.gameId}')"
        style="cursor:pointer"
      >

        <div class="hot-rank">

          #${index + 1}

        </div>

        <div class="hot-game">

          🔥 ${g.name}

        </div>

        <div class="hot-count">

          ${g.count} Steam Moves

        </div>

      </div>

    `)
    .join("");
document.getElementById("gameCount").innerHTML =
  `MLB • ${games.length} Games Today`;
const now = new Date();

document.getElementById(
  "lastUpdate"
).innerHTML =

  "Updated: " +

  now.toLocaleTimeString(
    [],
    {
      hour:'2-digit',
      minute:'2-digit'
    }
  );

document.getElementById("gamesToday").innerHTML =
  games.length;

let steamCount = 0;

const container =
  document.getElementById("games");

container.innerHTML = "";

games.forEach(game => {

const gameMoves =
  moves.filter(
    m => m.gameId === game.gameId
  );
const steamMovesCount =
  gameMoves.filter(
    move =>
      Math.abs(move.movement) >= 5
  ).length;

if(
  steamOnly &&
  steamMovesCount === 0
){
  return;
}
let movementHtml = "";

gameMoves.forEach(move => {

if(Math.abs(move.movement) >= 5){

steamCount++;

movementHtml += `
<div class="steam">

🔥 ${move.selection}

<br>

${move.old_odds}
→
${move.new_odds}

</div>
`;

}

});

container.innerHTML += `

<div class="card" id="game-${game.gameId}">
  <div
    class="card-header"
    onclick="toggleCard('card-${game.gameId}')"
  >

    <h3>

      ${game.away_team}
      vs
      ${game.home_team}

    </h3>

    <div class="time">

      ${game.commence_time}

    </div>

    <div class="expand-btn">

      ▼ Ver Mercados

    </div>

  </div>

  <div
    class="card-content"
    id="card-${game.gameId}"
  >

    <hr>

    <div class="market-title">
  Moneyline
</div>

<div class="odds-market">

  <div class="odds-btn">

    <span class="team-name">
      ${game.favorite}
    </span>

    <span class="team-odds">
      ${game.favorite_odds}
    </span>

  </div>

  <div class="odds-btn">

    <span class="team-name">
      ${game.underdog}
    </span>

    <span class="team-odds">
      ${game.underdog_odds}
    </span>

  </div>

</div>
   <div class="market-title">
  Runline
</div>

<div class="odds-market">

  <div class="odds-btn">

    <span class="team-name">
      ${Object.keys(game.runline)[0]}
    </span>

    <span class="team-odds">
      ${Object.values(game.runline)[0]}
    </span>

  </div>

  <div class="odds-btn">

    <span class="team-name">
      ${Object.keys(game.runline)[1]}
    </span>

    <span class="team-odds">
      ${Object.values(game.runline)[1]}
    </span>

  </div>

</div>

   <div class="market-title">
  Totals
</div>

<div class="odds-market">

  <div class="odds-btn">

    <span class="team-name">
      ${Object.keys(game.totals)[0]}
    </span>

    <span class="team-odds">
      ${Object.values(game.totals)[0]}
    </span>

  </div>

  <div class="odds-btn">

    <span class="team-name">
      ${Object.keys(game.totals)[1]}
    </span>

    <span class="team-odds">
      ${Object.values(game.totals)[1]}
    </span>

  </div>

</div>

    ${movementHtml ? `

      <div class="market-title steam">

        🔥 Movimiento

      </div>

      ${movementHtml}

    ` : ""}

  </div>

</div>

`;
});

document.getElementById("steamCount").innerHTML =
  steamCount;

}catch(error){

document.getElementById("games").innerHTML =
  "<div class='loading'>Error cargando partidos</div>";

console.error(error);

}

}
function toggleCard(id){

  const card =
    document.getElementById(id);

  if(card.style.display === "block"){

    card.style.display = "none";

  } else {

    card.style.display = "block";

  }

}
loadGames();

setInterval(
  loadGames,
  30000
);

</script>

</body>
</html>
