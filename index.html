<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dr Baseball</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0f1114;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

/* HEADER */

.header{
  background:#14181f;
  border-bottom:2px solid #f5b041;
  padding:20px;
  position:sticky;
  top:0;
  z-index:999;
}

.logo{
  font-size:32px;
  font-weight:bold;
}

.subtitle{
  color:#9aa0a6;
  margin-top:5px;
}

.game-count{
  margin-top:10px;
  color:#4CAF50;
  font-weight:bold;
}

/* MENU */

.sports-menu{
  padding:15px;
}

.sport-btn{
  width:100%;
  background:#1d232d;
  color:white;
  border:none;
  padding:15px;
  border-radius:10px;
  cursor:pointer;
  font-size:16px;
  font-weight:bold;
}

.sport-btn:hover{
  background:#2a3342;
}

.league-menu{
  display:none;
  margin-top:5px;
}

.league-item{
  background:#171b22;
  padding:14px;
  border-radius:10px;
  cursor:pointer;
  margin-top:5px;
}

.league-item:hover{
  background:#232a36;
}

/* STATS */

.stats-bar{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
  padding:0 15px 15px;
}

.stat-card{
  background:#171b22;
  padding:15px;
  border-radius:12px;
  text-align:center;
  border:1px solid #252d3a;
}

.stat-title{
  color:#9aa0a6;
  font-size:12px;
}

.stat-value{
  font-size:22px;
  font-weight:bold;
  margin-top:6px;
}

/* GAMES */

#games{
  display:none;
  grid-template-columns:
  repeat(auto-fill,minmax(340px,1fr));
  gap:15px;
  padding:15px;
}

.card{
  background:#171b22;
  border:1px solid #252d3a;
  border-radius:14px;
  padding:15px;
  transition:.2s;
}

.card:hover{
  transform:translateY(-4px);
  box-shadow:0 8px 18px rgba(0,0,0,.45);
}

.card h3{
  margin-bottom:8px;
}

.time{
  color:#999;
  margin-bottom:10px;
}

.market-title{
  color:#f5b041;
  font-weight:bold;
  margin-top:12px;
  margin-bottom:6px;
  text-transform:uppercase;
}

.favorite{
  color:#4CAF50;
  font-weight:bold;
}

.underdog{
  color:#ff6b6b;
  font-weight:bold;
}

.steam{
  margin-top:12px;
  background:#332300;
  border-left:4px solid gold;
  padding:10px;
  border-radius:8px;
  animation:pulse 2s infinite;
}

@keyframes pulse{

  0%{
    box-shadow:0 0 0 0 rgba(255,215,0,.4);
  }

  70%{
    box-shadow:0 0 0 12px rgba(255,215,0,0);
  }

  100%{
    box-shadow:0 0 0 0 rgba(255,215,0,0);
  }

}

.move-up{
  color:#4CAF50;
  font-weight:bold;
}

.move-down{
  color:#ff6b6b;
  font-weight:bold;
}

.loading{
  text-align:center;
  padding:30px;
  color:#999;
}
.stats-bar{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(250px,1fr));
  gap:10px;
  margin-bottom:20px;
}

.hot-card{
  background:#2b1d00;
  border:1px solid gold;
  border-radius:10px;
  padding:12px;
  text-align:center;
  font-weight:bold;
  color:#FFD700;
}

</style>

</head>

<body>

<header class="header">

  <div class="logo">
    ⚾ Dr Baseball
  </div>

  <div class="subtitle">
    MLB Odds & Steam Moves
  </div>

  <div id="gameCount" class="game-count">
    Loading...
  </div>

</header>

<div class="sports-menu">

  <button class="sport-btn" onclick="toggleLeague()">
    ⚾ Baseball ▼
  </button>

  <div id="leagueMenu" class="league-menu">

```
<div
  class="league-item"
  onclick="toggleMLB()">
  MLB
</div>
```

  </div>

</div>

<div class="stats-bar">

  <div class="stat-card">
    <div class="stat-title">Games</div>
    <div id="gamesToday" class="stat-value">0</div>
  </div>

  <div class="stat-card">
    <div class="stat-title">Steam Moves</div>
    <div id="steamCount" class="stat-value">0</div>
  </div>

  <div class="stat-card">
    <div class="stat-title">League</div>
    <div class="stat-value">MLB</div>
  </div>

  <div class="stat-card">
    <div class="stat-title">Refresh</div>
    <div class="stat-value">30s</div>
  </div>

</div>

<div style="padding:15px">

  <button onclick="showAllGames()">
    Todos
  </button>

  <button onclick="showSteamGames()">
    Steam Moves
  </button>

</div>

<div id="hotGames" class="stats-bar"></div>

<div id="games"></div>
<script>

const API_URL = "./todaycard.json";

let mlbVisible = false;
let steamOnly = false;

function showAllGames(){

  steamOnly = false;

  loadGames();

}

function showSteamGames(){

  steamOnly = true;

  loadGames();

}

function toggleLeague(){

  const menu =
    document.getElementById("leagueMenu");

  menu.style.display =
    menu.style.display === "block"
    ? "none"
    : "block";

}

function toggleMLB(){

  const games =
    document.getElementById("games");

  mlbVisible = !mlbVisible;

  games.style.display =
    mlbVisible
    ? "grid"
    : "none";

}

async function loadGames(){

try{

const response =
  await fetch(API_URL);

const games =
  await response.json();

const movesResponse =
  await fetch("./movements.json");

const moves =
  await movesResponse.json();

document.getElementById("gameCount").innerHTML =
  `MLB • ${games.length} Games Today`;

document.getElementById("gamesToday").innerHTML =
  games.length;

let steamCount = 0;

const container =
  document.getElementById("games");

container.innerHTML = "";

games.forEach(game => {

const gameMoves =
  moves.filter(
    m => m.gameId === game.gameId
  );

let movementHtml = "";

gameMoves.forEach(move => {

if(Math.abs(move.movement) >= 5){

steamCount++;

movementHtml += `
<div class="steam">

🔥 ${move.selection}

<br>

${move.old_odds}
→
${move.new_odds}

</div>
`;

}

});

container.innerHTML += `

<div class="card">

<h3>
${game.away_team}
vs
${game.home_team}
</h3>

<div class="time">
${game.commence_time}
</div>

<div>
<span class="favorite">
${game.favorite}
</span>
(${game.favorite_odds})
</div>

<div>
<span class="underdog">
${game.underdog}
</span>
(${game.underdog_odds})
</div>

<div class="market-title">
Runline
</div>

<div>
${Object.keys(game.runline)[0]}
(${Object.values(game.runline)[0]})
<br>
${Object.keys(game.runline)[1]}
(${Object.values(game.runline)[1]})
</div>

<div class="market-title">
Totals
</div>

<div>
${Object.keys(game.totals)[0]}
(${Object.values(game.totals)[0]})
<br>
${Object.keys(game.totals)[1]}
(${Object.values(game.totals)[1]})
</div>

${movementHtml}

</div>

`;

});

document.getElementById("steamCount").innerHTML =
  steamCount;

}catch(error){

document.getElementById("games").innerHTML =
  "<div class='loading'>Error cargando partidos</div>";

console.error(error);

}

}

loadGames();

setInterval(
  loadGames,
  30000
);

</script>

</body>
</html>
