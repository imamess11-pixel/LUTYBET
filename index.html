<script>

const API_URL = "./todaycard.json";

let mlbVisible = false;
let steamOnly = false;
let focusedGameId = null;

// El refresco automatico de 30s reconstruye toda la lista desde cero,
// asi que sin esto, cualquier seccion que el usuario abriera/cerrara
// manualmente (grupos de fecha, alternos) volvia a su estado por
// defecto en cada refresco - parecia que "se cerraban solas". Este
// Map guarda el estado real (abierto/cerrado) por id y sobrevive
// entre llamadas a loadGames().
let sectionOpenState = new Map();

// Devuelve si una seccion deberia estar abierta: prioriza lo que el
// usuario eligio manualmente, y si nunca la toco usa el default del
// tipo de seccion (alternos: cerrado: grupos de fecha: abierto).
function seccionEstaAbierta(id, defaultOpen){
  return sectionOpenState.has(id) ? sectionOpenState.get(id) : defaultOpen;
}

// Click en el logo LUTYBET: actualiza las cuotas y vuelve a la
// vista principal (sin filtro de steam, sin partido enfocado).
function goHome(){
  steamOnly = false;
  focusedGameId = null;
  loadGames();
}

function showAllGames(){

  steamOnly = false;

  loadGames();

}

function showSteamGames(){

  steamOnly = true;

  loadGames();

}

function toggleSports(){

  const menu =
    document.getElementById(
      "sportsMenu"
    );

  menu.style.display =
    menu.style.display === "block"
      ? "none"
      : "block";

}

function toggleLeague(menuId){

  const menu =
    document.getElementById(
      menuId
    );

  menu.style.display =
    menu.style.display === "block"
      ? "none"
      : "block";

}
function toggleMLB(){

  const module =
    document.getElementById("mlbModule");

  const games =
    document.getElementById("games");

  mlbVisible = !mlbVisible;

  if(mlbVisible){

      module.style.display="block";

      games.style.display="flex";

  }else{

      module.style.display="none";

  }

}function scrollToGame(gameId){

  const card =
    document.getElementById(
      "game-" + gameId
    );

  if(card){

    card.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

    card.style.border =
      "2px solid gold";

    setTimeout(() => {

      card.style.border =
        "1px solid #333";

    }, 3000);

  }
  

}
let steamFilter = false;

function filterSteamGames(){

  const cards =
    document.querySelectorAll(".game-row");

  const steamCard =
    document.querySelector(
      ".stat-card:nth-child(2)"
    );

  steamFilter = !steamFilter;

  cards.forEach(card => {

    if(steamFilter){

      if(
        !card.classList.contains(
          "has-steam"
        )
      ){

        card.style.display = "none";

      }

    } else {

      card.style.display = "";

    }
    

  });

  if(steamFilter){

    steamCard.classList.add(
      "stat-card-active"
    );

  } else {

    steamCard.classList.remove(
      "stat-card-active"
    );

  }

}
async function loadGames(){

try{

const response =
  await fetch(API_URL);

const games =
  await response.json();

const movesResponse =
  await fetch("./movements.json");

const moves =
  await movesResponse.json();
const hotGames = [];

games.forEach(game => {

  const count =
    moves.filter(
      m =>
        m.gameId === game.gameId &&
        Math.abs(m.movement) >= 5
    ).length;

 hotGames.push({
  gameId: game.gameId,
  name: game.away_team + " vs " + game.home_team,
  count
});

});

hotGames.sort(
  (a,b) => b.count - a.count
);
document.getElementById("hotGames").innerHTML =

  hotGames
    .filter(g => g.count > 0)
    .slice(0,3)
    .map((g,index) => `

      <div
        class="hot-card"
        onclick="scrollToGame('${g.gameId}')"
        style="cursor:pointer"
      >

        <div class="hot-rank">

          #${index + 1}

        </div>

        <div class="hot-game">

          🔥 ${g.name}

        </div>

        <div class="hot-count">

          ${g.count} Steam Moves

        </div>

      </div>

    `)
    .join("");
document.getElementById("gameCount").innerHTML =
  `MLB • ${games.length} Games Today`;
const now = new Date();

document.getElementById(
  "lastUpdate"
).innerHTML =

  "Updated: " +

  now.toLocaleTimeString(
    [],
    {
      hour:'2-digit',
      minute:'2-digit'
    }
  );

document.getElementById("gamesToday").innerHTML =
  games.length;

let steamCount = 0;

const container =
  document.getElementById("games");

container.innerHTML = "";

// ORDENAR POR FECHA REAL (para que el agrupado por dia salga bien)
games.sort((a, b) => {
  const da = new Date(a.commence_time);
  const db = new Date(b.commence_time);
  if (isNaN(da) || isNaN(db)) return 0;
  return da - db;
});

// Los partidos en vivo van primero, en su propia seccion "Live Now"
// (el orden cronologico interno de cada grupo ya quedo bien gracias
// al sort de arriba, filter() preserva ese orden relativo).
const gamesOrdenados = [
  ...games.filter(g => g.is_live),
  ...games.filter(g => !g.is_live)
];

function startOfDay(d){
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function dateGroupLabel(date){
  const diffDays = Math.round(
    (startOfDay(date) - startOfDay(new Date())) / 86400000
  );
  if(diffDays === 0) return "Today";
  if(diffDays === 1) return "Tomorrow";
  return date.toLocaleDateString('en-US', {
    weekday:'long',
    day:'numeric',
    month:'long'
  });
}

let lastGroupKey = null;
let groupIndex = 0;
let currentGroupId = null;
let currentGroupHeaderHtml = "";
let currentGroupHtml = "";
let currentGroupOpen = true;

// IMPORTANTE: container.innerHTML += "<div>" (sin cerrar) NO funciona
// para "dejar una etiqueta abierta" entre varias llamadas - el
// navegador auto-cierra las etiquetas sin cerrar cada vez que
// reprocesa el HTML. Por eso armamos el grupo completo (header +
// contenido + cierre) como un solo string y lo insertamos de una vez.
function flushGroup(){
  if(currentGroupId){
    container.innerHTML +=
      currentGroupHeaderHtml +
      `<div class="date-group" id="${currentGroupId}" style="display:${currentGroupOpen ? "block" : "none"};">${currentGroupHtml}</div>`;
  }
  currentGroupHtml = "";
}

gamesOrdenados.forEach(game => {

const gameMoves =
  moves.filter(
    m => m.gameId === game.gameId
  );
const steamMovesCount =
  gameMoves.filter(
    move =>
      Math.abs(move.movement) >= 5
  ).length;

if(
  steamOnly &&
  steamMovesCount === 0
){
  return;
}
let movementHtml = "";

// Lineas alternas (ALT_RUNLINE / ALT_TOTALS) que vienen como campos
// propios desde el doGet (game.alt_runline / game.alt_totals).
// Se agrupan por punto (para mostrar ambos equipos/Over-Under juntos,
// igual que la fila principal) y se ordenan de menor a mayor.

// Extrae el numero al final de un label tipo "Team Name +8.5" o "Over 7.5"
function extraerPuntoNumerico(label){
  const parts = String(label).trim().split(" ");
  const num = parseFloat(parts[parts.length - 1]);
  return isNaN(num) ? null : num;
}

// Punto de la linea principal (para excluirlo de las alternas y no
// repetirlo dos veces). Usado para TOTALS (no direccional, valor
// absoluto sirve porque Over/Under ya se emparejan por igual punto).
function puntoPrincipal(oddsObj){
  const entries = Object.entries(oddsObj || {});
  if(entries.length === 0) return null;
  const p = extraerPuntoNumerico(entries[0][0]);
  return p === null ? null : Math.abs(p);
}

// Punto CON SIGNO de la linea principal del equipo visitante (para
// RUNLINE). A diferencia de puntoPrincipal(), esto no usa valor
// absoluto porque necesitamos distinguir la linea principal exacta
// (ej. Arizona -1.5) de su inversa a la misma magnitud (Arizona +1.5),
// que es una linea alterna real y NO debe excluirse.
function puntoPrincipalRunlineAway(runlineObj, awayTeam){
  const entries = Object.entries(runlineObj || {});
  const awayEntry = entries.find(([label]) => label.startsWith(awayTeam));
  if(!awayEntry) return null;
  return extraerPuntoNumerico(awayEntry[0]);
}

// Limites de lineas alternas de runline, medidos desde la perspectiva
// del FAVORITO: direccion normal (favorito da carreras, valor negativo)
// hasta -4.5; direccion inversa (favorito recibe carreras, valor
// positivo) hasta +2.5. El equipo dog usa los mismos limites reflejados.
const ALT_RUNLINE_NORMAL_MAX = 4.5;
const ALT_RUNLINE_REVERSE_MAX = 2.5;

function agruparAltRunline(altRunlineObj, awayTeam, homeTeam, primarioAwaySigned, awayEsFavorito){

  const entries = Object.entries(altRunlineObj || {});
  const awayEntries = [];
  const homeEntries = [];

  entries.forEach(([label, odds]) => {

    const point = extraerPuntoNumerico(label);
    if(point === null) return;

    if(label.startsWith(awayTeam)) awayEntries.push({ label, odds, point });
    else if(label.startsWith(homeTeam)) homeEntries.push({ label, odds, point });

  });

  // IMPORTANTE: un mismo partido puede tener 2 lineas alternas reales
  // con la misma magnitud pero direcciones opuestas (ej. "Arizona -1.0"
  // y "Arizona +1.0" son 2 apuestas distintas, no la misma linea).
  // Por eso emparejamos cada entrada del visitante con la del local
  // que tenga el punto EXACTAMENTE opuesto, en vez de agrupar solo por
  // magnitud absoluta (lo cual pisaba una linea con la otra).
  const usedHome = new Set();
  const rows = [];

  awayEntries.forEach(awayEntry => {

    const homeEntry = homeEntries.find(h =>
      !usedHome.has(h) && Math.abs(h.point + awayEntry.point) < 0.001
    );

    if(homeEntry) usedHome.add(homeEntry);

    rows.push({ point: awayEntry.point, away: awayEntry, home: homeEntry || null });

  });

  // Cualquier entrada del local que no haya encontrado pareja del
  // visitante (el bookmaker solo publico ese lado)
  homeEntries.forEach(homeEntry => {
    if(!usedHome.has(homeEntry)){
      rows.push({ point: -homeEntry.point, away: null, home: homeEntry });
    }
  });

  return rows
    // Excluye SOLO la linea principal exacta (mismo punto Y mismo
    // signo desde la perspectiva del visitante) - no toda la magnitud,
    // para no tapar la inversa real a ese mismo numero.
    .filter(r => primarioAwaySigned === null || Math.abs(r.point - primarioAwaySigned) > 0.001)
    // Limite de rango: normal (favorito da carreras) hasta -4.5 /
    // inversa (favorito recibe carreras) hasta +2.5, reflejado para
    // el equipo dog.
    .filter(r => {
      const pointFavorito = awayEsFavorito ? r.point : -r.point;
      return pointFavorito < 0
        ? Math.abs(pointFavorito) <= ALT_RUNLINE_NORMAL_MAX
        : pointFavorito <= ALT_RUNLINE_REVERSE_MAX;
    })
    .sort((a, b) => a.point - b.point);

}

// Limite de rango para totales alternos: MLB rara vez tiene lineas
// utiles fuera de este rango, asi que se recortan los extremos.
const ALT_TOTALS_MIN = 6.5;
const ALT_TOTALS_MAX = 11.5;

function agruparAltTotals(altTotalsObj, puntoPrimario){

  const entries = Object.entries(altTotalsObj || {});
  const groups = {};

  entries.forEach(([label, odds]) => {

    const point = extraerPuntoNumerico(label);
    if(point === null) return;

    // No repetir la linea principal dentro de las alternas
    if(puntoPrimario !== null && Math.abs(point - puntoPrimario) < 0.001) return;

    // Limite de rango (6.5 a 11.5)
    if(point < ALT_TOTALS_MIN || point > ALT_TOTALS_MAX) return;

    if(!groups[point]) groups[point] = {};

    if(label.startsWith("Over")) groups[point].over = { label, odds };
    else if(label.startsWith("Under")) groups[point].under = { label, odds };

  });

  return Object.keys(groups)
    .map(k => parseFloat(k))
    .sort((a, b) => a - b)
    .map(k => groups[k]);

}

// Renderiza una fila con las 2 selecciones emparejadas (away+home, u
// Over+Under), igual de ancho cada una, lado a lado.
function renderAltPairRow(leftEntry, rightEntry, leftLabelText, rightLabelText, gameId, market){

  const leftPick = leftEntry
    ? renderPick(gameId, market, leftEntry.label, leftLabelText, leftEntry.odds)
    : `<div class="odds-pick odds-pick-empty"><span class="pick-point">${leftLabelText}</span><span class="pick-price">-</span></div>`;

  const rightPick = rightEntry
    ? renderPick(gameId, market, rightEntry.label, rightLabelText, rightEntry.odds)
    : `<div class="odds-pick odds-pick-empty"><span class="pick-point">${rightLabelText}</span><span class="pick-price">-</span></div>`;

  return `<div class="alt-line-row">${leftPick}${rightPick}</div>`;

}

// Seccion colapsable completa (encabezado clickeable + contenido
// oculto por defecto) para Alternate Run Lines / Alternate Totals.
// Empieza CERRADA - el usuario la abre haciendo click. Si el usuario
// ya la habia abierto/cerrado antes, respeta esa eleccion aunque
// pase el refresco automatico de 30s.
function renderAltSection(sectionId, titleText, headerLeft, headerRight, rowsHtml){

  if(!rowsHtml) return "";

  const abierta = seccionEstaAbierta(sectionId, false);

  return `
    <div class="market-title alt-toggle" onclick="toggleSection('${sectionId}')">
      <span id="${sectionId}-arrow">${abierta ? "▾" : "▸"}</span> ${titleText}
    </div>
    <div class="expand-panel alt-section" id="${sectionId}" style="display:${abierta ? "block" : "none"};">
      <div class="alt-header-row">
        <span>${headerLeft}</span>
        <span>${headerRight}</span>
      </div>
      ${rowsHtml}
    </div>
  `;

}

function renderAltRunline(altRunlineObj, gameId, awayTeam, homeTeam, primarioAwaySigned, awayEsFavorito){

  const groups = agruparAltRunline(altRunlineObj, awayTeam, homeTeam, primarioAwaySigned, awayEsFavorito);

  if(groups.length === 0) return "";

  return groups.map(g => renderAltPairRow(
    g.away, g.home,
    g.away ? extraerPunto(g.away.label, awayTeam) : "",
    g.home ? extraerPunto(g.home.label, homeTeam) : "",
    gameId, "ALT_RUNLINE"
  )).join("");

}

function renderAltTotals(altTotalsObj, gameId, puntoPrimario){

  const groups = agruparAltTotals(altTotalsObj, puntoPrimario);

  if(groups.length === 0) return "";

  return groups.map(g => renderAltPairRow(
    g.over, g.under,
    g.over ? g.over.label : "",
    g.under ? g.under.label : "",
    gameId, "ALT_TOTALS"
  )).join("");

}

// TEAM TOTALS / PLAYER PROPS / PITCHER PROPS
// Estos ya vienen agrupados por jugador/equipo desde el doGet

// Renderiza una lista de filas {player/team, point, over, under}
// como bloques: nombre + punto arriba, botones Over/Under abajo.
function renderSubjectPropList(rows, gameId, marketLabel, subjectField){

  if(!rows || rows.length === 0) return "";

  return rows.map(r => {
    const subject = r[subjectField] || "";
    return `
      <div class="prop-row">
        <div class="prop-subject">${escapeHtml(subject)} <span class="prop-point">${escapeHtml(r.point)}</span></div>
        <div class="alt-line-row">
          ${renderPick(gameId, marketLabel, subject + " Over " + r.point, "Over", r.over)}
          ${renderPick(gameId, marketLabel, subject + " Under " + r.point, "Under", r.under)}
        </div>
      </div>
    `;
  }).join("");

}

function renderTeamTotalsSection(game){

  const rows = game.team_totals || [];

  const sectionId = "teamtotals-" + game.gameId;

  return `

// Botones de filtro (Hits/HR/RBI o Strikeouts/Outs/Earned Runs) que
// muestran una lista a la vez. setPropFilter()/aplicarPropFilter()
// manejan cual esta activa, y recuerdan la eleccion entre refrescos
// igual que sectionOpenState.
function renderStatFilterSection(sectionId, titleText, gameId, category, stats, dataByStat){

  const tieneAlgo = stats.some(s => (dataByStat[s.key] || []).length > 0);
  if(!tieneAlgo) return "";

  const abierta = seccionEstaAbierta(sectionId, false);

  const filterButtons = stats.map(s => `
    <button
      class="filter-btn prop-filter"
      id="${category}propbtn-${s.key}-${gameId}"
      onclick="event.stopPropagation(); setPropFilter('${gameId}', '${category}', '${s.key}')"
    >${s.label}</button>
  `).join("");

  const lists = stats.map(s => `
    <div id="${category}prop-${s.key}-${gameId}">
      ${renderSubjectPropList(dataByStat[s.key], gameId, s.market, "player")}
    </div>
  `).join("");

  return `
    <div class="market-title alt-toggle" onclick="toggleSection('${sectionId}')">
      <span id="${sectionId}-arrow">${abierta ? "▾" : "▸"}</span> ${titleText}
    </div>
    <div class="expand-panel alt-section" id="${sectionId}" style="display:${abierta ? "block" : "none"};">
      <div class="prop-filter-row">${filterButtons}</div>
      ${lists}
    </div>
  `;

}

const PLAYER_PROP_STATS = [
  { key: "hits", label: "Hits", market: "PLAYER_PROP_HITS" },
  { key: "hr", label: "HR", market: "PLAYER_PROP_HR" },
  { key: "rbi", label: "RBI", market: "PLAYER_PROP_RBI" }
];

  { key: "strikeouts", label: "Strikeouts", market: "PITCHER_PROP_K" },

];

// Recuerda que stat (hits/hr/rbi, o strikeouts/outs/earned_runs) esta
// activo por partido, para que sobreviva al refresco automatico de 30s.
let propFilterState = new Map();

function aplicarPropFilter(gameId, category, stats){
  const key = category + "-" + gameId;
  const defaultStat = stats[0].key;
  const activo = propFilterState.has(key) ? propFilterState.get(key) : defaultStat;

  stats.forEach(s => {
    const el = document.getElementById(`${category}prop-${s.key}-${gameId}`);
    if(el) el.style.display = (s.key === activo) ? "block" : "none";

    const btn = document.getElementById(`${category}propbtn-${s.key}-${gameId}`);
    if(btn) btn.classList.toggle("active", s.key === activo);
  });
}

function setPropFilter(gameId, category, statKey){
  propFilterState.set(category + "-" + gameId, statKey);
  const stats = category === "player" ? PLAYER_PROP_STATS : PITCHER_PROP_STATS;
  aplicarPropFilter(gameId, category, stats);
}

// Extrae solo el punto (ej "-1.5") de una key tipo "Team Name -1.5",
// para no repetir el nombre del equipo que ya aparece a la izquierda.
function extraerPunto(label, teamName){
  if(!label) return "";
  return label.replace(teamName, "").trim() || label;
}

// Ordena un objeto de odds (runline) para que la primera entrada sea
// la del equipo visitante y la segunda la del local, alineado con
// el orden en que se muestran los equipos a la izquierda.
function ordenarPorEquipo(oddsObj, awayTeam, homeTeam){
  const entries = Object.entries(oddsObj || {});
  const away = entries.find(([label]) => label.startsWith(awayTeam));
  const home = entries.find(([label]) => label.startsWith(homeTeam));
  return { away, home };
}

// Boton clickeable para una seleccion completa (punto + cuota juntos
// como una sola unidad). Guarda los datos en data-* attributes;
// togglePick() resalta el boton entero y lo guarda en la boleta.
function renderPick(gameId, market, selectionKey, pointLabel, odds){

  if(odds === "" || odds === undefined || odds === null){
    return `
      <div class="odds-pick odds-pick-empty">
        <span class="pick-point">${pointLabel || ""}</span>
        <span class="pick-price">-</span>
      </div>
    `;
  }

  return `
    <button
      class="odds-pick"
      data-game="${gameId}"
      data-market="${market}"
      data-selection="${String(selectionKey).replace(/"/g,'&quot;')}"
      data-odds="${odds}"
      onclick="event.stopPropagation(); togglePick(this)"
    >
      <span class="pick-point">${pointLabel || ""}</span>
      <span class="pick-price">${odds}</span>
    </button>
  `;
}

// Boleta de apuestas en memoria - por ahora solo guarda las
// selecciones. El panel visual para mostrarla (con stake, total,

let selectedBets = [];

function togglePick(btn){

  const isSelected = btn.classList.toggle("selected");

  const pick = {
    gameId: btn.dataset.game,
    market: btn.dataset.market,
    selection: btn.dataset.selection,
    odds: btn.dataset.odds
  };

  if(isSelected){

    selectedBets.push(pick);

  } else {

    selectedBets = selectedBets.filter(b =>
      !(
        b.gameId === pick.gameId &&
        b.market === pick.market &&
        b.selection === pick.selection
      )
    );

  }

  console.log("Selecciones actuales:", selectedBets);

}

// MODO ENFOCADO: al hacer click en un partido, se oculta el resto
// (y las barras de fecha) y solo queda visible ese partido expandido.
// El estado se guarda en focusedGameId para que sobreviva al refresco
// automatico de cada 30s (ver applyFocusMode() al final de loadGames).

function toggleFocus(gameId){
  focusedGameId = (focusedGameId === gameId) ? null : gameId;
  applyFocusMode();
}

function exitFocusMode(){
  focusedGameId = null;
  applyFocusMode();
}

function applyFocusMode(){

  const container = document.getElementById("games");
  const backBtn = document.getElementById("backToAllBtn");

  if(!container) return;

  if(!focusedGameId){

    container.querySelectorAll(".game-row").forEach(r => r.style.display = "flex");
    container.querySelectorAll(".date-bar").forEach(d => d.style.display = "flex");
    container.querySelectorAll(".expand-panel").forEach(p => p.style.display = "none");
    if(backBtn) backBtn.style.display = "none";
    return;

  }

  container.querySelectorAll(".game-row").forEach(r => {
    r.style.display = (r.id === "game-" + focusedGameId) ? "flex" : "none";
  });

  container.querySelectorAll(".date-bar").forEach(d => d.style.display = "none");

  container.querySelectorAll(".expand-panel").forEach(p => {
    p.style.display = (p.id === "card-" + focusedGameId) ? "block" : "none";
  });

  if(backBtn) backBtn.style.display = "inline-block";

}

// Toggle generico para secciones colapsables (lineas alternas, grupos
// de fecha). Actualiza tambien la flechita si existe un span con id
// "{id}-arrow".
function toggleSection(id){

  const el = document.getElementById(id);
  if(!el) return;

  const willOpen = el.style.display !== "block";
  el.style.display = willOpen ? "block" : "none";

  // Recuerda la eleccion del usuario para que sobreviva al proximo
  // refresco automatico de 30s.
  sectionOpenState.set(id, willOpen);

  const arrow = document.getElementById(id + "-arrow");
  if(arrow) arrow.textContent = willOpen ? "▾" : "▸";

}

function toggleCard(id){

  const card =
    document.getElementById(id);

  if(card.style.display === "block"){

    card.style.display = "none";

  } else {

    card.style.display = "block";

  }

}
loadGames();

setInterval(
  loadGames,
  30000
);

</script>
