<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>Dr Baseball</title>

<style>

body{
  background:#111;
  color:white;
  font-family:Arial;
  margin:20px;
}

h1{
  text-align:center;
}

#games{
  display:grid;
  grid-template-columns:
  repeat(auto-fill,minmax(320px,1fr));
  gap:15px;
}

.card{

  border:1px solid #444;

  border-radius:10px;

  padding:15px;

  background:#1b1b1b;

}

.favorite{
  color:#4CAF50;
  font-weight:bold;
}

.time{
  color:#aaa;
}

</style>
</head>

<body>

<h1>⚾ Dr Baseball</h1>

<div id="games"></div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbx0KZByqbvgvbvj5qriAF__Tk6Ii9faSHnAcw9NssY/exec?type=todaycard";

async function loadGames(){

  try {

    document.getElementById("games").innerHTML =
      "<h2>Conectando...</h2>";

    const response = await fetch(API_URL);

    document.getElementById("games").innerHTML =
      "<h2>Respuesta recibida</h2>";

    const games = await response.json();

    document.getElementById("games").innerHTML =
      "<h2>Juegos: " + games.length + "</h2>";

    console.log(games);

  } catch(error){

    console.error(error);

    document.getElementById("games").innerHTML =
      "<h2>Error:</h2><pre>" +
      error.message +
      "</pre>";

  }

}

loadGames();

setInterval(
  loadGames,
  30000
);

</script>

</body>
</html>
