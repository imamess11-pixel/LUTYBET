<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>Dr Baseball</title>

<style>
 

body{
  background:
    linear-gradient(
      180deg,
      #0b0b0b 0%,
      #141414 50%,
      #1b1b1b 100%
    );

  color:white;
  font-family:Arial,sans-serif;
}

h1{
  text-align:center;
}

#games{
  display:grid;
  grid-template-columns:
  repeat(auto-fill,minmax(320px,1fr));
  gap:15px;
}
<div class="league-bar">
⚾ MLB • 15 Games Today
</div>
 .league-bar{

  background:#222;

  padding:12px;

  border-radius:8px;

  margin-bottom:15px;

  font-weight:bold;

}

 
.card{

  background:#1e1e1e;

  border:1px solid #333;

  border-radius:14px;

  box-shadow:
    0 4px 12px rgba(0,0,0,.4);

  transition:.2s;
}
 .card:hover{

  transform:translateY(-3px);

  box-shadow:
    0 8px 20px rgba(0,0,0,.6);

}
.steam{

  color:#FFD700;

  font-weight:bold;

  background:#2b1d00;

  border-left:4px solid #FFD700;

  padding:8px;

  border-radius:6px;

  animation:pulse 2s infinite;

}

.odds{
  font-weight:bold;
}

.favorite-tag{
  color:#4CAF50;
}

.favorite{
  color:#4CAF50;
  font-weight:bold;
}

.time{
  color:#aaa;
}
.header{
  background:
    linear-gradient(
      90deg,
      #0f0f0f,
      #1c1c1c
    );

  border-bottom:2px solid #f5b041;

  padding:20px;

  position:sticky;
  top:0;
  z-index:999;
}

.logo{
  font-size:32px;
  font-weight:bold;
  color:white;
}

.subtitle{
  color:#999;
  margin-top:5px;
  font-size:14px;
}

.game-count{
  margin-top:10px;
  color:#4CAF50;
  font-weight:bold;
}
@keyframes pulse{

  0%{
    box-shadow:0 0 0 0 rgba(255,215,0,.4);
  }

  70%{
    box-shadow:0 0 0 10px rgba(255,215,0,0);
  }

  100%{
    box-shadow:0 0 0 0 rgba(255,215,0,0);
  }

}
.sports-menu{

  margin-bottom:20px;

}

.sport-btn{

  width:100%;

  background:#1e1e1e;

  color:white;

  border:1px solid #333;

  padding:14px;

  border-radius:10px;

  cursor:pointer;

  font-size:16px;

  font-weight:bold;

}

.sport-btn:hover{

  background:#2a2a2a;

}

.league-menu{

  display:none;

  margin-top:5px;

  border:1px solid #333;

  border-radius:10px;

  overflow:hidden;

}

.league-item{

  background:#171717;

  padding:12px;

  cursor:pointer;

}

.league-item:hover{

  background:#252525;

}

 
</style>
</head>

<body>

<header class="header">

  <div class="logo">
    ⚾ Dr Baseball
  </div>

  <div class="subtitle">
    MLB Odds & Line Movements
  </div>

  <div id="gameCount" class="game-count">
    Loading...
  </div>

</header>

 <div class="sports-menu">

  <button class="sport-btn" onclick="toggleLeague()">
    ⚾ Baseball ▼
  </button>

  <div id="leagueMenu" class="league-menu">

    <div
  class="league-item"
  onclick="toggleMLB()"
>
  MLB
</div>

  </div>

</div>

<div id="games"></div>

 <script>
document.addEventListener(
  "DOMContentLoaded",
  () => {
    document.getElementById("games")
      .style.display = "none";
  }
);
</script>

<script>
const API_URL = "./todaycard.json";

async function loadGames(){

  try {

    const response = await fetch(API_URL);
    const games = await response.json();

    const container =
      document.getElementById("games");

    container.innerHTML = "";

   document.getElementById("gameCount").innerHTML =
  `MLB • ${games.length} Games Today`;

   const movesResponse =
  await fetch("./movements.json");

const moves =
  await movesResponse.json();

   games.forEach(game => {

  const gameMoves = moves.filter(
    move => move.gameId === game.gameId
  );

  let movementHtml = "";

  gameMoves.forEach(move => {

    if(Math.abs(move.movement) >= 5){

      movementHtml += `

        <div>

          ${move.selection}

          <br>

          ${move.old_odds}
          →
          ${move.new_odds}

        </div>

      `;

    }

  });

  container.innerHTML += `

    <div class="card">

      <h3>
        ${game.away_team}
        vs
        ${game.home_team}
      </h3>

      <div class="time">
        ${game.commence_time}
      </div>

      <hr>

      <div>
        ${game.favorite}
        <span class="favorite">
          (${game.favorite_odds})
        </span>
      </div>

      <div>
        ${game.underdog}
        (${game.underdog_odds})
      </div>

      <div class="market-title">
        Runline
      </div>

      <div>

        ${Object.keys(game.runline)[0]}
        (${Object.values(game.runline)[0]})

        <br>

        ${Object.keys(game.runline)[1]}
        (${Object.values(game.runline)[1]})

      </div>

      <div class="market-title">
        Totals
      </div>

      <div>

        ${Object.keys(game.totals)[0]}
        (${Object.values(game.totals)[0]})

        <br>

        ${Object.keys(game.totals)[1]}
        (${Object.values(game.totals)[1]})

      </div>

      ${movementHtml ? `

        <div class="market-title steam">

          🔥 Movimiento

        </div>

        ${movementHtml}

      ` : ""}

    </div>

  `;

});

  } catch(error){

    document.getElementById("games").innerHTML =
      "<h2>Error cargando partidos</h2>";

    console.error(error);

  }

}

function toggleMLB(){

  const gamesDiv =
    document.getElementById("games");

  if(mlbVisible){

    gamesDiv.style.display = "none";

    mlbVisible = false;

  } else {

    gamesDiv.style.display = "grid";

    mlbVisible = true;

  }

}
 
loadGames();

setInterval(
  loadGames,
  30000
);

</script>

</body>
</html>
