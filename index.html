<script>

// Cada liga lee de sus propios archivos JSON estaticos (los mismos
// que subes a mano a GitHub desde ?type=todaycard&sport=XXX). Cuando
// agregues otra liga, solo hay que sumar una entrada aca.
// Todo lo que hace falta para agregar una liga nueva al sidebar y a
// la carga de datos: UNA entrada aca. El sidebar se genera solo a
// partir de esto - no hace falta escribir HTML a mano nunca mas.
// "category" debe coincidir con alguna key de SPORT_CATEGORIES.
const LEAGUES = {
  mlb:           { label: "MLB",           category: "baseball", todaycard: "./todaycard.json",          movements: "./movements.json" },
  npb:           { label: "NPB (Japan)",   category: "baseball", todaycard: "./todaycard_npb.json",      movements: "./movements_npb.json" },
  nfl:           { label: "NFL",           category: "football", todaycard: "./todaycard_nfl.json",      movements: "./movements_nfl.json" },
  nfl_preseason: { label: "NFL Preseason", category: "football", todaycard: "./todaycard_nfl_pre.json",  movements: "./movements_nfl_pre.json" }
  // Ejemplo para cuando agreguemos WNBA/Euroleague/NCAAF:
  // wnba: { label: "WNBA", category: "basketball", todaycard: "./todaycard_wnba.json", movements: "./movements_wnba.json" },
};

// Categorias del sidebar, en el orden que se muestran. Una categoria
// sin ninguna liga en LEAGUES sale como item fijo (sin flecha, sin
// submenu) - listo para cuando le agregues su primera liga.
const SPORT_CATEGORIES = [
  { key: "baseball",   icon: "⚾", label: "Baseball" },
  { key: "basketball", icon: "🏀", label: "Basketball" },
  { key: "football",   icon: "🏈", label: "Football" },
  { key: "hockey",     icon: "🏒", label: "Hockey" },
  { key: "soccer",     icon: "⚽", label: "Soccer" }
];

// Arma el HTML del sidebar completo a partir de SPORT_CATEGORIES +
// LEAGUES, y lo inyecta en #sidebarSportsContainer. Se llama una vez
// al cargar la pagina - agregar una liga nueva no requiere tocar esta
// funcion, solo el objeto LEAGUES de arriba.
function construirSidebar(){

  const container = document.getElementById("sidebarSportsContainer");
  if(!container) return;

  const html = SPORT_CATEGORIES.map(cat => {

    const ligasDeCategoria = Object.entries(LEAGUES).filter(([key, liga]) => liga.category === cat.key);

    if(ligasDeCategoria.length === 0){
      // Sin ligas todavia en esta categoria - item fijo, sin submenu
      return `<div class="sidebar-item" style="opacity:0.5;cursor:default;">${cat.icon} ${cat.label}</div>`;
    }

    const submenuId = "sidebar-" + cat.key;

    const subitems = ligasDeCategoria.map(([key, liga]) => `
      <div class="sidebar-subitem" onclick="toggleLeagueModule('${key}')" style="cursor:pointer;">
        ${liga.label}
      </div>
    `).join("");

    return `
      <div class="sidebar-item" onclick="toggleLeague('${submenuId}')" style="cursor:pointer;">
        ${cat.icon} ${cat.label} ▼
      </div>
      <div id="${submenuId}" class="sub-menu">
        ${subitems}
      </div>
    `;

  }).join("");

  container.innerHTML = html;

}

// Busca el icono de la categoria a la que pertenece una liga (ej.
// "nfl" -> "🏈"), para mostrarlo junto al nombre en el titulo.
function iconoDeLiga(sport){
  const liga = LEAGUES[sport];
  if(!liga) return "⚾";
  const categoria = SPORT_CATEGORIES.find(c => c.key === liga.category);
  return categoria ? categoria.icon : "⚾";
}

// "Runline" es jerga de beisbol - en football americano y basketball
// el mismo tipo de mercado se llama "Spread". Se usa para los
// encabezados de columna y el titulo de la seccion de alternas.
function nombreSpread(sport){
  const liga = LEAGUES[sport];
  const categoria = liga ? liga.category : "baseball";
  return categoria === "baseball" ? "Run Line" : "Spread";
}

// Los props/innings/team totals de esta version son especificos de
// beisbol (batter_*, pitcher_*, 1st inning, etc.) - no tiene sentido
// mostrar esas secciones vacias en NFL/basketball. Cuando agreguemos
// props propios de football/basketball, se puede expandir esto.
function esBeisbol(sport){
  const liga = LEAGUES[sport];
  const categoria = liga ? liga.category : "baseball";
  return categoria === "baseball";
}

let currentSport = "mlb";

function getTodaycardUrl(){
  return (LEAGUES[currentSport] || LEAGUES.mlb).todaycard;
}

function getMovementsUrl(){
  return (LEAGUES[currentSport] || LEAGUES.mlb).movements;
}

// Evita inyeccion de HTML/XSS al insertar datos externos (nombres de
// jugadores, equipos, etc.) directamente en el HTML.
function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

let mlbVisible = false;
let steamOnly = false;
let focusedGameId = null;

// El refresco automatico de 30s reconstruye toda la lista desde cero,
// asi que sin esto, cualquier seccion que el usuario abriera/cerrara
// manualmente (grupos de fecha, alternos) volvia a su estado por
// defecto en cada refresco - parecia que "se cerraban solas". Este
// Map guarda el estado real (abierto/cerrado) por id y sobrevive
// entre llamadas a loadGames().
let sectionOpenState = new Map();

// Devuelve si una seccion deberia estar abierta: prioriza lo que el
// usuario eligio manualmente, y si nunca la toco usa el default del
// tipo de seccion (alternos: cerrado: grupos de fecha: abierto).
function seccionEstaAbierta(id, defaultOpen){
  return sectionOpenState.has(id) ? sectionOpenState.get(id) : defaultOpen;
}

// FIX: PLAYER_PROP_STATS/PITCHER_PROP_STATS, propFilterState,
// aplicarPropFilter() y setPropFilter() estaban declaradas DENTRO de
// loadGames(). Eso las hacia invisibles para los botones onclick del
// HTML (que se ejecutan en el scope global, no en el de loadGames) -
// por eso el boton nunca funcionaba, aunque la funcion "existiera" en
// el archivo. Ademas, al estar dentro de loadGames, propFilterState
// se reseteaba a un Map vacio en cada refresco de 30s. Todo esto debe
// vivir a nivel superior del script, igual que sectionOpenState.

const PLAYER_PROP_STATS = [
  { key: "hits", label: "Hits", market: "PLAYER_PROP_HITS" },
  { key: "hr", label: "HR", market: "PLAYER_PROP_HR" },
  { key: "rbi", label: "RBI", market: "PLAYER_PROP_RBI" }
];

const PITCHER_PROP_STATS = [
  { key: "strikeouts", label: "Strikeouts", market: "PITCHER_PROP_K" },
  { key: "outs", label: "Outs", market: "PITCHER_PROP_OUTS" },
  { key: "earned_runs", label: "Earned Runs", market: "PITCHER_PROP_ER" }
];

// Recuerda que stat (hits/hr/rbi, o strikeouts/outs/earned_runs) esta
// activo por partido, para que sobreviva al refresco automatico de 30s.
let propFilterState = new Map();

function aplicarPropFilter(gameId, category, stats){
  const key = category + "-" + gameId;
  const defaultStat = stats[0].key;
  const activo = propFilterState.has(key) ? propFilterState.get(key) : defaultStat;

  stats.forEach(s => {
    const el = document.getElementById(`${category}prop-${s.key}-${gameId}`);

// Lineas alternas (ALT_RUNLINE / ALT_TOTALS) que vienen como campos
// propios desde el doGet (game.alt_runline / game.alt_totals).
// Se agrupan por punto (para mostrar ambos equipos/Over-Under juntos,
// igual que la fila principal) y se ordenan de menor a mayor.

// Extrae el numero al final de un label tipo "Team Name +8.5" o "Over 7.5"
function extraerPuntoNumerico(label){
  const parts = String(label).trim().split(" ");
  const num = parseFloat(parts[parts.length - 1]);
  return isNaN(num) ? null : num;
}

// Punto de la linea principal (para excluirlo de las alternas y no
// repetirlo dos veces). Usado para TOTALS (no direccional, valor
// absoluto sirve porque Over/Under ya se emparejan por igual punto).
function puntoPrincipal(oddsObj){
  const entries = Object.entries(oddsObj || {});
  if(entries.length === 0) return null;
  const p = extraerPuntoNumerico(entries[0][0]);
  return p === null ? null : Math.abs(p);
}

// Punto CON SIGNO de la linea principal del equipo visitante (para
// RUNLINE). A diferencia de puntoPrincipal(), esto no usa valor
// absoluto porque necesitamos distinguir la linea principal exacta
// (ej. Arizona -1.5) de su inversa a la misma magnitud (Arizona +1.5),
// que es una linea alterna real y NO debe excluirse.
function puntoPrincipalRunlineAway(runlineObj, awayTeam){
  const entries = Object.entries(runlineObj || {});
  const awayEntry = entries.find(([label]) => label.startsWith(awayTeam));
  if(!awayEntry) return null;
  return extraerPuntoNumerico(awayEntry[0]);
}

// Limites de lineas alternas de runline, medidos desde la perspectiva
// del FAVORITO: direccion normal (favorito da carreras, valor negativo)
// hasta -4.5; direccion inversa (favorito recibe carreras, valor
// positivo) hasta +2.5. El equipo dog usa los mismos limites reflejados.
const ALT_RUNLINE_NORMAL_MAX = 4.5;
const ALT_RUNLINE_REVERSE_MAX = 2.5;

function agruparAltRunline(altRunlineObj, awayTeam, homeTeam, primarioAwaySigned, awayEsFavorito){

  const entries = Object.entries(altRunlineObj || {});
  const awayEntries = [];
  const homeEntries = [];

  entries.forEach(([label, odds]) => {

    const point = extraerPuntoNumerico(label);
    if(point === null) return;

    if(label.startsWith(awayTeam)) awayEntries.push({ label, odds, point });
    else if(label.startsWith(homeTeam)) homeEntries.push({ label, odds, point });

  });

  // IMPORTANTE: un mismo partido puede tener 2 lineas alternas reales
  // con la misma magnitud pero direcciones opuestas (ej. "Arizona -1.0"
  // y "Arizona +1.0" son 2 apuestas distintas, no la misma linea).
  // Por eso emparejamos cada entrada del visitante con la del local
  // que tenga el punto EXACTAMENTE opuesto, en vez de agrupar solo por
  // magnitud absoluta (lo cual pisaba una linea con la otra).
  const usedHome = new Set();
  const rows = [];

  awayEntries.forEach(awayEntry => {

    const homeEntry = homeEntries.find(h =>
      !usedHome.has(h) && Math.abs(h.point + awayEntry.point) < 0.001
    );

    if(homeEntry) usedHome.add(homeEntry);

    rows.push({ point: awayEntry.point, away: awayEntry, home: homeEntry || null });

  });

  // Cualquier entrada del local que no haya encontrado pareja del
  // visitante (el bookmaker solo publico ese lado)
  homeEntries.forEach(homeEntry => {
    if(!usedHome.has(homeEntry)){
      rows.push({ point: -homeEntry.point, away: null, home: homeEntry });
    }
  });

  return rows
    // Excluye SOLO la linea principal exacta (mismo punto Y mismo
    // signo desde la perspectiva del visitante) - no toda la magnitud,
    // para no tapar la inversa real a ese mismo numero.
    .filter(r => primarioAwaySigned === null || Math.abs(r.point - primarioAwaySigned) > 0.001)
    // Limite de rango: normal (favorito da carreras) hasta -4.5 /
    // inversa (favorito recibe carreras) hasta +2.5, reflejado para
    // el equipo dog.
    .filter(r => {
      const pointFavorito = awayEsFavorito ? r.point : -r.point;
      return pointFavorito < 0
        ? Math.abs(pointFavorito) <= ALT_RUNLINE_NORMAL_MAX
        : pointFavorito <= ALT_RUNLINE_REVERSE_MAX;
    })
    .sort((a, b) => a.point - b.point);

}

// Limite de rango para totales alternos, por deporte: MLB rara vez
// tiene lineas utiles fuera de este rango. NPB (y ligas futuras) usan
// su propio rango, o ninguno si ya vienen limitadas desde el backend
// (Apps Script ya recorta NPB a 4 magnitudes antes de llegar aca).
const ALT_TOTALS_RANGES = {
  mlb: { min: 6.5, max: 11.5 },
  npb: { min: 0, max: 999 } // sin filtro extra - ya viene acotado del backend
};

function rangoAltTotals(sport){
  return ALT_TOTALS_RANGES[sport] || ALT_TOTALS_RANGES.mlb;
}

function agruparAltTotals(altTotalsObj, puntoPrimario, sport){

  const entries = Object.entries(altTotalsObj || {});
  const groups = {};
  const rango = rangoAltTotals(sport);

  entries.forEach(([label, odds]) => {

    const point = extraerPuntoNumerico(label);
    if(point === null) return;

    // No repetir la linea principal dentro de las alternas
    if(puntoPrimario !== null && Math.abs(point - puntoPrimario) < 0.001) return;

    // Limite de rango (depende del deporte)
    if(point < rango.min || point > rango.max) return;

    if(!groups[point]) groups[point] = {};

    if(label.startsWith("Over")) groups[point].over = { label, odds };
    else if(label.startsWith("Under")) groups[point].under = { label, odds };

  });

  return Object.keys(groups)
    .map(k => parseFloat(k))
    .sort((a, b) => a - b)
    .map(k => groups[k]);

}

// Renderiza una fila con las 2 selecciones emparejadas (away+home, u
// Over+Under), igual de ancho cada una, lado a lado.
function renderAltPairRow(leftEntry, rightEntry, leftLabelText, rightLabelText, gameId, market){

  const leftPick = leftEntry
    ? renderPick(gameId, market, leftEntry.label, leftLabelText, leftEntry.odds)
    : `<div class="odds-pick odds-pick-empty"><span class="pick-point">${leftLabelText}</span><span class="pick-price">-</span></div>`;

  const rightPick = rightEntry
    ? renderPick(gameId, market, rightEntry.label, rightLabelText, rightEntry.odds)
    : `<div class="odds-pick odds-pick-empty"><span class="pick-point">${rightLabelText}</span><span class="pick-price">-</span></div>`;

  return `<div class="alt-line-row">${leftPick}${rightPick}</div>`;

}

// Seccion colapsable completa (encabezado clickeable + contenido
// oculto por defecto) para Alternate Run Lines / Alternate Totals.
// Empieza CERRADA - el usuario la abre haciendo click. Si el usuario
// ya la habia abierto/cerrado antes, respeta esa eleccion aunque
// pase el refresco automatico de 30s.
function renderAltSection(sectionId, titleText, headerLeft, headerRight, rowsHtml){

  if(!rowsHtml) return "";

  const abierta = seccionEstaAbierta(sectionId, false);

  return `
    <div class="market-title alt-toggle" onclick="toggleSection('${sectionId}')">
      <span id="${sectionId}-arrow">${abierta ? "▾" : "▸"}</span> ${titleText}
    </div>
    <div class="expand-panel alt-section" id="${sectionId}" style="display:${abierta ? "block" : "none"};">
      <div class="alt-header-row">
        <span>${headerLeft}</span>
        <span>${headerRight}</span>
      </div>
      ${rowsHtml}
    </div>
  `;

}

function renderAltRunline(altRunlineObj, gameId, awayTeam, homeTeam, primarioAwaySigned, awayEsFavorito){

  const groups = agruparAltRunline(altRunlineObj, awayTeam, homeTeam, primarioAwaySigned, awayEsFavorito);

  if(groups.length === 0) return "";

  return groups.map(g => renderAltPairRow(
    g.away, g.home,
    g.away ? extraerPunto(g.away.label, awayTeam) : "",
    g.home ? extraerPunto(g.home.label, homeTeam) : "",
    gameId, "ALT_RUNLINE"
  )).join("");

}

function renderAltTotals(altTotalsObj, gameId, puntoPrimario, sport){

  const groups = agruparAltTotals(altTotalsObj, puntoPrimario, sport);

  if(groups.length === 0) return "";

  return groups.map(g => renderAltPairRow(
    g.over, g.under,
    g.over ? g.over.label : "",
    g.under ? g.under.label : "",
    gameId, "ALT_TOTALS"
  )).join("");

}

// ============================================================
// TEAM TOTALS / PLAYER PROPS / PITCHER PROPS
// Estos ya vienen agrupados por jugador/equipo desde el doGet
// (cada fila trae { player o team, point, over, under }), asi que
// aca solo hace falta renderizarlos - no hay que emparejar nada.
// ============================================================

// Renderiza una lista de filas {player/team, point, over, under}
// como bloques: nombre + punto arriba, botones Over/Under abajo.
function renderSubjectPropList(rows, gameId, marketLabel, subjectField){

  if(!rows || rows.length === 0) return "";

  return rows.map(r => {
    const subject = r[subjectField] || "";
    return `
      <div class="prop-row">
        <div class="prop-subject">${escapeHtml(subject)} <span class="prop-point">${escapeHtml(r.point)}</span></div>
        <div class="alt-line-row">
          ${renderPick(gameId, marketLabel, subject + " Over " + r.point, "Over", r.over)}
          ${renderPick(gameId, marketLabel, subject + " Under " + r.point, "Under", r.under)}
        </div>
      </div>
    `;
  }).join("");

}

// Seccion colapsable generica, sin encabezado de columnas fijo (a
// diferencia de renderAltSection) - para secciones con contenido
// mixto como Moneyline+Runline+Totals juntos (1 Inning, 1st 5 Innings).
function renderCollapsibleSection(sectionId, titleText, innerHtml){

  if(!innerHtml) return "";

  const abierta = seccionEstaAbierta(sectionId, false);

  return `
    <div class="market-title alt-toggle" onclick="toggleSection('${sectionId}')">
      <span id="${sectionId}-arrow">${abierta ? "▾" : "▸"}</span> ${titleText}
    </div>
    <div class="expand-panel alt-section" id="${sectionId}" style="display:${abierta ? "block" : "none"};">
      ${innerHtml}
    </div>
  `;

}

// Muestra un mercado de periodo (moneyline/runline/totals de 1 inning
// o 1st 5 innings) de a pares, tal cual vienen - normalmente son 1-2
// lineas, no hace falta la logica de rango/limite de las alternas.
function renderPeriodPairs(oddsObj, gameId, marketLabel){

  const entries = Object.entries(oddsObj || {});
  if(entries.length === 0) return "";

  const rows = [];
  for(let i = 0; i < entries.length; i += 2){
    const pair = entries.slice(i, i + 2);
    const picks = pair.map(([label, odds]) => renderPick(gameId, marketLabel, label, label, odds)).join("");
    rows.push(`<div class="alt-line-row">${picks}</div>`);
  }

  return rows.join("");

}

function renderPeriodSection(sectionId, titleText, periodData, gameId, marketPrefix){

  if(!periodData) return "";

  const mlHtml = renderPeriodPairs(periodData.moneyline, gameId, marketPrefix + "_ML");
  const rlHtml = renderPeriodPairs(periodData.runline, gameId, marketPrefix + "_RL");
  const totHtml = renderPeriodPairs(periodData.totals, gameId, marketPrefix + "_TOT");

  const subTitulo = (texto) =>
    `<div style="color:#9aa0a6;font-size:11px;font-weight:bold;text-transform:uppercase;margin-top:8px;">${texto}</div>`;

  const contenido =
    (mlHtml ? subTitulo("Moneyline") + mlHtml : "") +
    (rlHtml ? subTitulo("Runline") + rlHtml : "") +
    (totHtml ? subTitulo("Totals") + totHtml : "");

  if(!contenido) return "";

  return renderCollapsibleSection(sectionId, titleText, contenido);

}

function renderTeamTotalsSection(game){

  const rows = game.team_totals || [];
  if(rows.length === 0) return "";

  const sectionId = "teamtotals-" + game.gameId;
  const abierta = seccionEstaAbierta(sectionId, false);

  return `
    <div class="market-title alt-toggle" onclick="toggleSection('${sectionId}')">
      <span id="${sectionId}-arrow">${abierta ? "▾" : "▸"}</span> Team Totals
    </div>
    <div class="expand-panel alt-section" id="${sectionId}" style="display:${abierta ? "block" : "none"};">
      ${renderSubjectPropList(rows, game.gameId, "TEAM_TOTALS", "team")}
    </div>
  `;

}

// Botones de filtro (Hits/HR/RBI o Strikeouts/Outs/Earned Runs) que
// muestran una lista a la vez. setPropFilter()/aplicarPropFilter()
// manejan cual esta activa, y recuerdan la eleccion entre refrescos
// igual que sectionOpenState.
function renderStatFilterSection(sectionId, titleText, gameId, category, stats, dataByStat){

  const tieneAlgo = stats.some(s => (dataByStat[s.key] || []).length > 0);
  if(!tieneAlgo) return "";

  const abierta = seccionEstaAbierta(sectionId, false);

  const filterButtons = stats.map((s, idx) => `
    <button
      class="filter-btn prop-filter${idx === 0 ? " active" : ""}"
      id="${category}propbtn-${s.key}-${gameId}"
      onclick="event.stopPropagation(); setPropFilter('${gameId}', '${category}', '${s.key}')"
    >${s.label}</button>
  `).join("");

  const lists = stats.map((s, idx) => `
    <div id="${category}prop-${s.key}-${gameId}" style="display:${idx === 0 ? "block" : "none"};">
      ${renderSubjectPropList(dataByStat[s.key], gameId, s.market, "player")}
    </div>
  `).join("");

  return `
    <div class="market-title alt-toggle" onclick="toggleSection('${sectionId}')">
      <span id="${sectionId}-arrow">${abierta ? "▾" : "▸"}</span> ${titleText}
    </div>
    <div class="expand-panel alt-section" id="${sectionId}" style="display:${abierta ? "block" : "none"};">
      <div class="prop-filter-row">${filterButtons}</div>
      ${lists}
    </div>
  `;

}

function renderPlayerPropsSection(game){
  return renderStatFilterSection(
    "playerprops-" + game.gameId,
    "Player Props",
    game.gameId,
    "player",
    PLAYER_PROP_STATS,
    game.player_props || {}
  );
}

function renderPitcherPropsSection(game){
  return renderStatFilterSection(
    "pitcherprops-" + game.gameId,
    "Pitcher Props",
    game.gameId,
    "pitcher",
    PITCHER_PROP_STATS,
    game.pitcher_props || {}
  );
}

// Extrae solo el punto (ej "-1.5") de una key tipo "Team Name -1.5",
// para no repetir el nombre del equipo que ya aparece a la izquierda.
function extraerPunto(label, teamName){
  if(!label) return "";
  return label.replace(teamName, "").trim() || label;
}

// Ordena un objeto de odds (runline) para que la primera entrada sea
// la del equipo visitante y la segunda la del local, alineado con
// el orden en que se muestran los equipos a la izquierda.
function ordenarPorEquipo(oddsObj, awayTeam, homeTeam){
  const entries = Object.entries(oddsObj || {});
  const away = entries.find(([label]) => label.startsWith(awayTeam));
  const home = entries.find(([label]) => label.startsWith(homeTeam));
  return { away, home };
}

// Boton clickeable para una seleccion completa (punto + cuota juntos
// como una sola unidad). Guarda los datos en data-* attributes;
// togglePick() resalta el boton entero y lo guarda en la boleta.
function renderPick(gameId, market, selectionKey, pointLabel, odds){

  if(odds === "" || odds === undefined || odds === null){
    return `
      <div class="odds-pick odds-pick-empty">
        <span class="pick-point">${pointLabel || ""}</span>
        <span class="pick-price">-</span>
      </div>
    `;
  }

  return `
    <button
      class="odds-pick"
      data-game="${gameId}"
      data-market="${market}"
      data-selection="${String(selectionKey).replace(/"/g,'&quot;')}"
      data-odds="${odds}"
      onclick="event.stopPropagation(); togglePick(this)"
    >
      <span class="pick-point">${pointLabel || ""}</span>
      <span class="pick-price">${odds}</span>
    </button>
  `;
}

const { away: awayRL, home: homeRL } =
  ordenarPorEquipo(game.runline, game.away_team, game.home_team);

const { away: awayTot, home: homeTot } = (() => {
  const entries = Object.entries(game.totals || {});
  // Totals no es por equipo (Over/Under), se deja en el orden que venga
  return { away: entries[0], home: entries[1] };
})();

const awayIsFavorite = game.favorite === game.away_team;
const awayML = awayIsFavorite ? game.favorite_odds : game.underdog_odds;
const homeML = awayIsFavorite ? game.underdog_odds : game.favorite_odds;

currentGroupHtml += `

<div class="game-row" id="game-${game.gameId}" onclick="toggleFocus('${game.gameId}')">

  <div class="game-time">
    ${game.is_live ? '<span class="live-badge">🔴 LIVE</span>' : game.commence_time.split(" ").slice(1).join(" ")}
  </div>

  <div class="game-teams">
    <div class="game-team-line">${game.away_team}</div>
    <div class="game-team-line">${game.home_team}</div>
  </div>

  <div class="odds-col">
    ${renderPick(game.gameId, "Runline", awayRL ? awayRL[0] : "", awayRL ? extraerPunto(awayRL[0], game.away_team) : "", awayRL ? awayRL[1] : "")}
    ${renderPick(game.gameId, "Runline", homeRL ? homeRL[0] : "", homeRL ? extraerPunto(homeRL[0], game.home_team) : "", homeRL ? homeRL[1] : "")}
  </div>

  <div class="odds-col">
    ${renderPick(game.gameId, "Totals", awayTot ? awayTot[0] : "", awayTot ? awayTot[0] : "", awayTot ? awayTot[1] : "")}
    ${renderPick(game.gameId, "Totals", homeTot ? homeTot[0] : "", homeTot ? homeTot[0] : "", homeTot ? homeTot[1] : "")}
  </div>

  <div class="odds-col">
    ${renderPick(game.gameId, "Moneyline", game.away_team, game.away_team, awayML)}
    ${renderPick(game.gameId, "Moneyline", game.home_team, game.home_team, homeML)}
  </div>

</div>

<div class="expand-panel" id="card-${game.gameId}">

  ${renderAltSection(
    "altrunline-" + game.gameId,
    "Alternate " + nombreSpread(game.sport) + "s",
    game.away_team,
    game.home_team,
    renderAltRunline(game.alt_runline, game.gameId, game.away_team, game.home_team, puntoPrincipalRunlineAway(game.runline, game.away_team), game.favorite === game.away_team)
  )}

  ${renderAltSection(
    "alttotals-" + game.gameId,
    "Alternate Totals",
    "Over",
    "Under",
    renderAltTotals(game.alt_totals, game.gameId, puntoPrincipal(game.totals), game.sport)
  )}

  ${esBeisbol(game.sport) ? renderPeriodSection("inning1-" + game.gameId, "1st Inning", game.innings_1, game.gameId, "INN1") : ""}

  ${esBeisbol(game.sport) ? renderPeriodSection("inning5-" + game.gameId, "1st 5 Innings", game.innings_5, game.gameId, "INN5") : ""}

  ${esBeisbol(game.sport) ? renderTeamTotalsSection(game) : ""}

  ${esBeisbol(game.sport) ? renderPlayerPropsSection(game) : ""}

  ${esBeisbol(game.sport) ? renderPitcherPropsSection(game) : ""}

  ${movementHtml ? `<div class="market-title steam">🔥 Movimiento</div>${movementHtml}` : ""}

  ${!renderAltRunline(game.alt_runline, game.gameId, game.away_team, game.home_team, puntoPrincipalRunlineAway(game.runline, game.away_team), game.favorite === game.away_team) && !renderAltTotals(game.alt_totals, game.gameId, puntoPrincipal(game.totals), game.sport) && !movementHtml ? `<div class="time">Sin datos adicionales por ahora.</div>` : ""}

</div>

`;
});

// Flushea el ultimo grupo de fecha que haya quedado en el buffer
flushGroup();

// Aplica el filtro de props activo (Hits/HR/RBI, Strikeouts/Outs/
// Earned Runs) para cada partido. Se llama para todos aunque un
// partido no tenga esa seccion - simplemente no encuentra los
// elementos y no hace nada (inofensivo).
// AISLADO en su propio try/catch: si esto falla por cualquier razon,
// los partidos YA DIBUJADOS arriba se quedan visibles - solo se pierde
// el filtro de props, no toda la cartelera.
try {
  gamesOrdenados.forEach(g => {
    if(typeof aplicarPropFilter === "function"){
      aplicarPropFilter(g.gameId, "player", PLAYER_PROP_STATS);
      aplicarPropFilter(g.gameId, "pitcher", PITCHER_PROP_STATS);
    }
  });
} catch(propFilterError) {
  console.error("Error aplicando filtro de props (no afecta los partidos):", propFilterError);
}

document.getElementById("steamCount").innerHTML =
  steamCount;

// Reaplica el modo "enfocado" (si hay uno activo) despues de cada
// refresco, para que el refresco automatico de 30s no lo resetee.
// Tambien aislado - un fallo aca no debe borrar los partidos.
try {
  applyFocusMode();
} catch(focusModeError) {
  console.error("Error aplicando modo enfocado (no afecta los partidos):", focusModeError);
}

}catch(error){

document.getElementById("games").innerHTML =
  "<div class='loading'>Error cargando partidos</div>";

console.error(error);

}

}
// Boleta de apuestas en memoria - por ahora solo guarda las
// selecciones. El panel visual para mostrarla (con stake, total,
// etc.) se puede construir despues sobre este mismo array.
let selectedBets = [];

function togglePick(btn){

  const isSelected = btn.classList.toggle("selected");

  const pick = {
    gameId: btn.dataset.game,
    market: btn.dataset.market,
    selection: btn.dataset.selection,
    odds: btn.dataset.odds
  };

  if(isSelected){

    selectedBets.push(pick);

  } else {

    selectedBets = selectedBets.filter(b =>
      !(
        b.gameId === pick.gameId &&
        b.market === pick.market &&
        b.selection === pick.selection
      )
    );

  }

  console.log("Selecciones actuales:", selectedBets);

}

// MODO ENFOCADO: al hacer click en un partido, se oculta el resto
// (y las barras de fecha) y solo queda visible ese partido expandido.
// El estado se guarda en focusedGameId para que sobreviva al refresco
// automatico de cada 30s (ver applyFocusMode() al final de loadGames).

function toggleFocus(gameId){
  focusedGameId = (focusedGameId === gameId) ? null : gameId;
  applyFocusMode();
}

function exitFocusMode(){
  focusedGameId = null;
  applyFocusMode();
}

function applyFocusMode(){

  const container = document.getElementById("games");
  const backBtn = document.getElementById("backToAllBtn");

  if(!container) return;

  if(!focusedGameId){

    container.querySelectorAll(".game-row").forEach(r => r.style.display = "flex");
    container.querySelectorAll(".date-bar").forEach(d => d.style.display = "flex");
    container.querySelectorAll(".expand-panel").forEach(p => p.style.display = "none");
    if(backBtn) backBtn.style.display = "none";
    return;

  }

  container.querySelectorAll(".game-row").forEach(r => {
    r.style.display = (r.id === "game-" + focusedGameId) ? "flex" : "none";
  });

  container.querySelectorAll(".date-bar").forEach(d => d.style.display = "none");

  container.querySelectorAll(".expand-panel").forEach(p => {
    p.style.display = (p.id === "card-" + focusedGameId) ? "block" : "none";
  });

  if(backBtn) backBtn.style.display = "inline-block";

}

// Toggle generico para secciones colapsables (lineas alternas, grupos
// de fecha). Actualiza tambien la flechita si existe un span con id
// "{id}-arrow".
function toggleSection(id){

  const el = document.getElementById(id);
  if(!el) return;

  const willOpen = el.style.display !== "block";
  el.style.display = willOpen ? "block" : "none";

  // Recuerda la eleccion del usuario para que sobreviva al proximo
  // refresco automatico de 30s.
  sectionOpenState.set(id, willOpen);

  const arrow = document.getElementById(id + "-arrow");
  if(arrow) arrow.textContent = willOpen ? "▾" : "▸";

}

function toggleCard(id){

  const card =
    document.getElementById(id);

  if(card.style.display === "block"){

    card.style.display = "none";

  } else {

    card.style.display = "block";

  }

}
construirSidebar();

loadGames();

setInterval(
  loadGames,
  30000
);

</script>
</div>
</div>
</body>
</html>
